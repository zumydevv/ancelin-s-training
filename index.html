<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ancelin Training</title>
  <meta name="description" content="Programme salle et nutrition d'Ancelin">
  <meta name="theme-color" content="#07080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="statusbar" aria-hidden="true"></div>

  <main id="view"></main>

  <div id="rest" class="rest hidden" role="timer" aria-live="polite">
    <svg class="rest-ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="track" cx="24" cy="24" r="20"/>
      <circle id="rest-arc" class="arc" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="0"/>
    </svg>
    <div class="grow">
      <div class="rest-label" id="rest-label">Repos</div>
      <div class="rest-time" id="rest-time">0:00</div>
    </div>
    <button class="icon-btn" data-rest="-15" aria-label="Retirer 15 secondes">−15</button>
    <button class="icon-btn" data-rest="15" aria-label="Ajouter 15 secondes">+15</button>
    <button class="icon-btn" data-rest="stop" aria-label="Passer le repos">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="dock" aria-label="Navigation">
    <a href="#/" data-tab="today">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>
      Aujourd'hui
    </a>
    <a href="#/programme" data-tab="programme">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      Programme
    </a>
    <a href="#/nutrition" data-tab="nutrition">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5c-1.6-1.3-3.9-1.5-5.6-.4C3.8 8.8 3.6 12.5 4.9 15.6c1.1 2.7 3.2 5.4 4.9 5.4.9 0 1.3-.5 2.2-.5s1.3.5 2.2.5c1.7 0 3.8-2.7 4.9-5.4 1.3-3.1 1.1-6.8-1.5-8.5-1.7-1.1-4-.9-5.6.4z"/><path d="M12 7.5c0-2.2 1.1-3.8 3.2-4.5"/></svg>
      Nutrition
    </a>
    <a href="#/suivi" data-tab="suivi">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 15l3.5-4.5 3 2.5L20 7"/></svg>
      Suivi
    </a>
  </nav>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
